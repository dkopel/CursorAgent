<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CursorAgent - Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>CursorAgent</h1>
        <p>Create your account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password">
          <div class="password-strength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-text" id="strengthText"></div>
          </div>
          <div class="password-requirements" id="requirements"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
      </form>

      <div class="links">
        <p>Already have an account? <a href="/">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (getToken()) window.location.href = '/dashboard.html';

    const passwordInput = document.getElementById('password');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    const requirements = document.getElementById('requirements');

    passwordInput.addEventListener('input', () => {
      updateStrengthBar(passwordInput.value, strengthFill, strengthText);
      updatePasswordRequirements(passwordInput.value, requirements);
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const { ok, data } = await apiCall('/api/auth/register', 'POST', { email, password, confirmPassword });

      if (ok) {
        showAlert('alert', 'Account created! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/', 1500);
      } else {
        const msg = data.details ? data.details.join(' ') : (data.error || 'Registration failed.');
        showAlert('alert', msg, 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
