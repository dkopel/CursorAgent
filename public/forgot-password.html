<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CursorAgent - Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>CursorAgent</h1>
        <p>Reset your password</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Send Reset Link</button>
      </form>

      <div class="links">
        <p><a href="/">Back to login</a></p>
      </div>

      <div class="dev-panel" id="devPanel" style="display:none;">
        <h4>Dev Mode: Sent Emails</h4>
        <p>Reset emails will appear here since no SMTP server is configured.</p>
        <div id="emailList"></div>
        <button class="btn btn-outline" style="margin-top: 12px; padding: 8px;" onclick="refreshEmails()">Refresh</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const email = document.getElementById('email').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { ok, data } = await apiCall('/api/auth/forgot-password', 'POST', { email });

      showAlert('alert', data.message || 'Check your email for a reset link.', 'success');
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      document.getElementById('devPanel').style.display = 'block';
      refreshEmails();
    });

    async function refreshEmails() {
      const { ok, data } = await apiCall('/api/auth/dev/sent-emails', 'GET');
      const list = document.getElementById('emailList');
      if (ok && data.emails.length > 0) {
        list.innerHTML = data.emails.map(e =>
          `<div class="email-entry">
            <strong>To:</strong> ${e.to}<br>
            <strong>Time:</strong> ${e.sentAt}<br>
            <strong>Reset Link:</strong> <a href="${e.resetUrl}">${e.resetUrl}</a>
          </div>`
        ).join('');
      } else {
        list.innerHTML = '<p>No emails sent yet.</p>';
      }
    }
  </script>
</body>
</html>
