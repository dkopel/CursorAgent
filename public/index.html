<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CursorAgent - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>CursorAgent</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
      </form>

      <div class="links">
        <p><a href="/forgot-password.html">Forgot your password?</a></p>
        <p style="margin-top: 8px;">Don't have an account? <a href="/register.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const { ok, data } = await apiCall('/api/auth/login', 'POST', { email, password });

      if (ok) {
        setAuth(data.token, data.user);
        window.location.href = '/dashboard.html';
      } else {
        showAlert('alert', data.error || 'Login failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
