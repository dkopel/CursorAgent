<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CursorAgent - Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>CursorAgent</h1>
        <p>Set your new password</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required autocomplete="new-password">
          <div class="password-strength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-text" id="strengthText"></div>
          </div>
          <div class="password-requirements" id="requirements"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
      </form>

      <div class="links">
        <p><a href="/">Back to login</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const tokenId = params.get('id');

    if (!token || !tokenId) {
      showAlert('alert', 'Invalid reset link. Please request a new password reset.', 'error');
      document.getElementById('resetForm').style.display = 'none';
    }

    const passwordInput = document.getElementById('newPassword');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    const requirements = document.getElementById('requirements');

    passwordInput.addEventListener('input', () => {
      updateStrengthBar(passwordInput.value, strengthFill, strengthText);
      updatePasswordRequirements(passwordInput.value, requirements);
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      const { ok, data } = await apiCall('/api/auth/reset-password', 'POST', {
        tokenId, token, newPassword, confirmPassword
      });

      if (ok) {
        showAlert('alert', data.message, 'success');
        document.getElementById('resetForm').style.display = 'none';
        document.querySelector('.links').innerHTML = '<p><a href="/">Sign in with your new password</a></p>';
      } else {
        const msg = data.details ? data.details.join(' ') : (data.error || 'Reset failed.');
        showAlert('alert', msg, 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
